    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header__inner">
            <h1 class="header__logo"><a href="./index.html"><img src="img/logo.png" alt="コトづくり研究所"></a></h1>

        <button class="header__toggle" id="js-nav-toggle" type="button" aria-label="メニュー">
            <span></span><span></span><span></span>
        </button>

        <nav class="header__global-nav">
            <ul>
                <li><a href="./index.html" class="header__global-logo"><img src="img/logo.png" alt="コトづくり研究所"></a></li>
                <li><a href="./index.html">ホーム</a></li>
                <li><a href="./news.html">お知らせ</a></li>
                <li><a href="./info.html">私たちについて</a></li>
                <li><a href="./contact.html">お問い合わせ</a></li>
                <li><a href="./about.html">出来ること</a></li>
                <li><a href="./renntaru.html">レンタル</a></li>
            </ul>
        </nav>
        <nav class="header__sub-nav">
            <ul>
                <li><a href="https://www.instagram.com/koto_zukuri_lab/"><img src="./img/icon/Instagram.png" alt=""> <p>Insta</p></a></li>
                <li><a href="./access.html"><img src="./img/icon/access.svg" alt=""> <p>Access</p></a></li>
                <li><a href="./news.html"><img src="./img/icon/news.svg" alt=""> <p>News</p></a></li>
            </ul>
        </nav>
        <small>©Kotodukuri</small>
        </div>
    </header>

    <main class="renntaru">
        <section class="firstview">
            <div class="firstview__inner">
                <video autoplay muted loop playsinline>
                    <source src="./movie/rentaru-mov.mp4" type="video/mp4">
                </video>

                <img src="./img/wave-top.svg" alt="" class="firstview__wave">

                <div class="firstview__text">
                    <h2 class="firstview__catch">
                        あなたの「したいこと」<br>
                        初めてみませんか。
                    </h2>
                </div>
            </div>
        </section>

        <section class="message">
            <p class="message__text">
                商店街に面するカウンター。<br>
                自由に使えるボックス。<br>
                料理研究家が主宰する料理教室。<br>
                個性が滲み出るシェアハウス。<br>
                それぞれレンタルすることができます。<br>
                小さなスペースから気軽に<br>
                お店をはじめられます。
            </p>
        </section>

        <div class="pickup">
            <div class="pickup__01"><img src="./img/pickup-01.webp" width="58" alt="みんなの"></div>
            <div class="pickup__02">
                <img src="./img/pickup-02.webp" width="58" alt="したい">
                <div class="pulse-container">
                    <div class="pulse-dot"></div>
                    <div class="pulse-ring" style="--i: 0;"></div>
                    <div class="pulse-ring" style="--i: 1;"></div>
                    <div class="pulse-ring" style="--i: 2;"></div>
                </div>
            </div>
            <div class="pickup__03"><img src="./img/pickup-03.webp" width="58" alt="を実現"></div>
        </div>

        <footer class="footer-bottom">
            <div class="footer-bottom__inner">
                <p class="footer-bottom__logo"><img src="img/logo.png" alt="コトづくり研究所"></p>
                <ul class="footer-bottom__nav">
                    <li><a href="privacy.html">プライバシーポリシー</a></li>
                    <li><a href="contact.html">お問い合わせ</a></li>
                </ul>
            </div>
        </footer>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
